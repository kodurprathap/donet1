name: Build dotnetapp

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          cd Netflix
          dotnet restore
      - name: Build
        run: |
          cd Netflix
          dotnet build --configuration Release --no-restore    

           