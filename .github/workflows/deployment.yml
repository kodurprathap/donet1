name: Test node project 
on: 
    push:
        branches: 
            - main 
    pull_request:
        branches: 
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code 
              uses: actions/checkout@v4  
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'  
            
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test            

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code 
              uses: actions/checkout@v4 
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'  
            
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
            - name: Deploy
              run: echo "deploying application"
              
            

                      